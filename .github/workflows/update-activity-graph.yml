name: Update Activity Graph
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  update-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate static contribution graph
        run: |
          python3 << 'PY'
          import json, urllib.request, datetime, os

          user = "kagamineee"
          token = os.environ.get("GITHUB_TOKEN")
          headers = {"Authorization": f"Bearer {token}"} if token else {}

          query = """
          query($user: String!) {
            user(login: $user) {
              contributionsCollection {
                contributionCalendar {
                  weeks {
                    contributionDays { contributionCount date }
                  }
                }
              }
            }
          }
          """
          req = urllib.request.Request(
              "https://api.github.com/graphql",
              data=json.dumps({"query": query, "variables": {"user": user}}).encode(),
              headers={**headers, "Content-Type": "application/json"},
          )
          data = json.loads(urllib.request.urlopen(req).read())
          weeks = data["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]

          # 你的主题色
          BG = "#0f1a0f"
          LOW = "#134e4a"
          MID = "#1a7f5a"
          HIGH = "#e6f4ef"
          W, H = 53 * 12, 7 * 14 + 24
          cell, gap = 10, 2
          svg = [f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">',
                 f'<rect width="{W}" height="{H}" fill="{BG}"/>']
          max_c = max((d["contributionCount"] for w in weeks for d in w["contributionDays"]), default=1) or 1

          for wi, week in enumerate(weeks):
              for di, day in enumerate(week["contributionDays"]):
                  c = day["contributionCount"]
                  if c == 0:
                      fill = "#1a2a1a"  # 零贡献日的暗绿
                  elif c <= max_c * 0.33:
                      fill = LOW
                  elif c <= max_c * 0.66:
                      fill = MID
                  else:
                      fill = HIGH
                  x, y = wi * 12, di * 14 + 20
                  svg.append(f'<rect x="{x}" y="{y}" width="{cell}" height="{cell}" rx="2" fill="{fill}"/>')
          svg.append("</svg>")
          with open("activity-graph.svg", "w") as f:
              f.write("\n".join(svg))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add activity-graph.svg
          git commit -m "chore: update activity graph" || exit 0
          git push
